[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-152"
version = "0.1.0"
description = "Auditable instant runoff counting with exhausted ballots"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
ranked-ballots = "ranked_ballots.cli:main"
ranked-ballots-archive = "ranked_ballots.archive_cli:main"
ranked-ballots-audit = "ranked_ballots.audit_cli:main"
ranked-ballots-link = "ranked_ballots.link_cli:main"
ranked-ballots-pairwise = "ranked_ballots.pairwise_cli:main"
ranked-ballots-sensitivity = "ranked_ballots.sensitivity_cli:main"
ranked-ballots-disclosure = "ranked_ballots.disclosure_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
